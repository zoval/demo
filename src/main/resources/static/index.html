<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Bank Simulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }

        .bank-box {
            padding: 25px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        .balance-display {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin: 15px 0;
            padding: 10px;
            background-color: #ecf0f1;
            border-radius: 4px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background-color: #27ae60;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #219653;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="bank-box">
        <h2>Apex Online Banking</h2>
        <div class="balance-display">Current Balance: $<span id="balance">0.00</span></div>

        <label for="transaction-type" style="display:block; text-align:left; font-size:14px; color:#555;">Select
            Action:</label>
        <select id="transaction-type">
            <option value="deposit">Deposit Funds</option>
            <option value="withdraw">Withdraw Funds</option>
        </select>

        <input type="number" id="amount" placeholder="Enter Amount ($)" min="0.01" step="0.01">
        <button onclick="processTransaction()">Submit Transaction</button>
        <div id="message"></div>
    </div>

    <script>
        // Fetch current balance on page load
        async function updateBalance() {
            try {
                const response = await fetch('/api/bank/balance');
                const data = await response.json();
                document.getElementById('balance').innerText = data.balance.toFixed(2);
            } catch (err) {
                showFeedback("Error reaching server.", "red");
            }
        }

        async function processTransaction() {
            const type = document.getElementById('transaction-type').value;
            const amount = document.getElementById('amount').value;
            const msgDiv = document.getElementById('message');

            if (!amount || amount <= 0) {
                showFeedback("Please enter a valid amount.", "red");
                return;
            }

            try {
                const response = await fetch('/api/bank/transaction', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, amount })
                });
                const data = await response.json();

                if (data.error) {
                    showFeedback(data.error, "red");
                } else {
                    showFeedback(data.message, "green");
                    document.getElementById('balance').innerText = data.balance.toFixed(2);
                    document.getElementById('amount').value = ""; // clear field
                }
            } catch (err) {
                showFeedback("Transaction execution error.", "red");
            }
        }

        function showFeedback(text, color) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = text;
            msgDiv.style.color = color;
        }

        // Initialize balance display
        updateBalance();
    </script>
</body>

</html>
